[pytest]
testpaths = tests
addopts = --strict-markers -ra
markers =
    email: email validation suite
    length: string length suite
    ip: IPv4 and IPv6 suite
    smoke: representative valid and invalid cases
    boundary: boundary value analysis
    ecp: equivalence class partitioning
    negative: invalid inputs or settings
    faizan: Faizan review allocation
    usman: Usman review allocation (review pending)
